<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anywhere P2P Drop</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 90%; max-width: 400px; text-align: center; }
        button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 1rem; }
        button:hover { background: #2563eb; }
        textarea { width: 100%; height: 80px; margin-top: 0.5rem; background: #334155; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; padding: 0.5rem; }
        input[type="file"] { margin: 1rem 0; }
        .status { margin-top: 1rem; color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Anywhere P2P Share</h2>
        <p id="step-title">Step 1: Initialize Connection</p>
        
        <div id="setup-area">
            <button id="btn-init">Create Handshake Code</button>
            <textarea id="txt-handshake" placeholder="Handshake data will appear here or paste receiver code here..."></textarea>
            <button id="btn-connect" style="background:#10b981">Connect to Peer</button>
        </div>

        <div id="share-area" style="display:none;">
            <p style="color:#10b981; font-weight:bold;">✓ Connected!</p>
            <input type="file" id="file-input"><br>
            <progress id="progress" value="0" max="100" style="width:100%; display:none;"></progress>
            <div id="download-link"></div>
        </div>
        <div class="status" id="status-msg">Disconnected</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
